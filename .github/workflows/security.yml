name: Security

# GitHub Advanced Security is not enabled on this repository, so the native
# secret-scanning and Dependabot alerting surfaces are unavailable. Everything
# below runs on a standard Actions runner and needs no licence.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Dependency advisories are published after our code stops changing, so a
    # push-only trigger would go stale. Weekly, Monday 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # A secret removed from HEAD is still live if it remains reachable in
          # any earlier commit. Scanning only the working tree would report a
          # clean repository while the credential is still published.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/v${GITLEAKS_VERSION}/${asset}" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan every commit
        # --redact: CI logs on a public repository are themselves a disclosure
        # channel. A scanner that prints the secret it found has leaked it again.
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1

  python-dependencies:
    name: Dependency audit (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit resolved dependency tree
        # --strict fails on advisories that carry no fix, rather than passing
        # them silently. An unfixable advisory is still an exposure.
        run: pip-audit --progress-spinner off --strict --desc

  node-dependencies:
    name: Dependency audit (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        # No package-lock.json is committed, so this resolves fresh on every run
        # and the audited tree is not necessarily the tree a developer has
        # locally. Commit a lockfile and this becomes reproducible.
        run: npm install --no-audit --no-fund

      - name: Audit
        run: npm audit --audit-level=high
