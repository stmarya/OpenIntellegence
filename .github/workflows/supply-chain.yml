name: Supply chain
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip cyclonedx-bom
      - run: pip install -e .
      - run: cyclonedx-py environment --output-file backend-sbom.json
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Resolve frontend dependency graph
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Export frontend dependency tree
        working-directory: frontend
        run: npm ls --all --json > ../frontend-dependencies.json || test -s ../frontend-dependencies.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-inventory
          path: |
            backend-sbom.json
            frontend-dependencies.json
          retention-days: 30
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t openintelligence:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: openintelligence:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
