name: API verification

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.12 · API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile every Python module
        run: python -m compileall -q app tests alembic

      - name: Lint source and tests
        run: ruff check app tests

      - name: Execute unit and API contract tests
        run: pytest -q
