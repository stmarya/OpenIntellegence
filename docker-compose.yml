# Local development stack.
#
# Passwords here are throwaway values for a laptop. Do not reuse this file
# in any shared or production environment.

name: openintelligence

services:
  postgres:
    # TimescaleDB image already bundles the timescaledb extension; pgvector
    # is installed by the init script below.
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: openintel
      POSTGRES_PASSWORD: openintel
      POSTGRES_DB: openintel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openintel -d openintel"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    # Persistence matters: the rate limiter keeps its sliding windows here,
    # and losing them on restart briefly resets every tenant's quota.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearchdata:/usr/share/opensearch/data

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: openintel
      MINIO_ROOT_PASSWORD: openintel123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Mock connector endpoint for dev/CI validation.
  # Accepts Slack webhook, Jira, and SIEM push payloads and responds with
  # deterministic 200/503 based on the X-Mock-Status header.
  # Never exposes real credentials. Not used in production.
  mock-connector:
    image: mockserver/mockserver:5.15.0
    environment:
      MOCKSERVER_SERVER_PORT: "1080"
      MOCKSERVER_LOG_LEVEL: WARN
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/mock-connector.json
    ports:
      - "1080:1080"
    volumes:
      - ./dev/mock-connector:/config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:1080/mockserver/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: ******postgres:5432/openintel
      REDIS_URL: redis://redis:6379/0
      AGENT_CA_CERT_PATH: /srv/app/certs/agent-ca.crt
      AGENT_CA_KEY_PATH: /srv/app/certs/agent-ca.key
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./certs:/srv/app/certs:ro
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --frozen-lockfile && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      NODE_ENV: development
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  opensearchdata:
  miniodata:
